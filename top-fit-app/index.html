<!doctype html>
<html lang="pt-BR" class="dark" data-accent="lima">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/top-fit-app/dist/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/top-fit-app/dist/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOP Fit" />
    <title>T.O.P. Fit App</title>
    <script>
      // Aplica o tema salvo antes de pintar (evita piscar o tema escuro no modo claro)
      try {
        var t = (JSON.parse(localStorage.getItem('top-fit-app') || '{}').state || {}).theme;
        if (t) {
          var dark = t.mode === 'sistema' ? matchMedia('(prefers-color-scheme: dark)').matches : t.mode !== 'claro';
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.dataset.accent = t.accent || 'lima';
          r.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0a0a' : '#f7f7f7');
          if (!dark) document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
